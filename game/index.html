<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solmar City — an open-world crime story</title>
<link rel="icon" href="data:,">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a2028;
    font-family: Georgia, 'Times New Roman', serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #nogl { display: none; position: fixed; inset: 0; background: #222; color: #fff;
    padding: 40px; font-size: 20px; z-index: 99; }

  .hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
  .hud-label { font-size: 11px; letter-spacing: 2px; opacity: 0.8; font-family: Arial, sans-serif; }
  .hud-tl { position: absolute; top: 14px; left: 16px; }
  .health-wrap { margin-bottom: 6px; }
  .health-bar { width: 210px; height: 14px; background: rgba(0,0,0,0.55); border: 1px solid rgba(255,255,255,0.5);
    border-radius: 3px; overflow: hidden; margin-top: 2px; }
  .health-fill { height: 100%; width: 100%; background: #4caf50; transition: width 0.2s; }
  .cash { font-size: 26px; font-weight: bold; color: #7ee787; margin-left: 6px; }
  .cash-wrap { font-family: Arial, sans-serif; }
  .hud-tr { position: absolute; top: 14px; right: 16px; text-align: right; }
  .stars { font-size: 30px; letter-spacing: 4px; color: #ffd21f; }
  .wanted-label { font-size: 11px; letter-spacing: 3px; opacity: 0.8; font-family: Arial, sans-serif; }
  .hud-tc { position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    text-align: center; width: 560px; max-width: 55vw; }
  .objective { font-size: 17px; background: rgba(0,0,0,0.55); padding: 8px 14px;
    border-radius: 4px; border-left: 4px solid #ffd21f; }
  .timer { display: inline-block; margin-top: 6px; font-size: 26px; font-weight: bold; color: #ff6b5e;
    background: rgba(0,0,0,0.6); padding: 4px 12px; border-radius: 4px; }
  .hud-bl { position: absolute; left: 16px; bottom: 16px; }
  .minimap { width: 190px; height: 190px; border: 2px solid rgba(255,255,255,0.65);
    border-radius: 50%; background: rgba(10,14,20,0.8); display: block; }
  .map-label { text-align: center; font-size: 11px; letter-spacing: 3px; margin-top: 4px;
    font-family: Arial, sans-serif; opacity: 0.85; }
  .hud-br { position: absolute; right: 18px; bottom: 16px; text-align: right; }
  .speed { font-size: 34px; font-weight: bold; }
  .car-name { font-size: 15px; opacity: 0.9; font-style: italic; }
  .hud-bc { position: absolute; left: 50%; bottom: 110px; transform: translateX(-50%); width: 340px; }
  .progress-label { text-align: center; font-size: 15px; margin-bottom: 5px; }
  .progress-bar { height: 12px; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.6);
    border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; width: 0%; background: #ffd21f; }
  .feed { position: absolute; left: 16px; bottom: 230px; width: 380px; font-size: 14px; }
  .feed-line { background: rgba(0,0,0,0.55); padding: 6px 10px; margin-top: 4px;
    border-radius: 3px; border-left: 3px solid #ffd21f; transition: opacity 1s; font-family: Arial, sans-serif; }
  .big-message { position: absolute; left: 50%; top: 30%; transform: translateX(-50%);
    text-align: center; width: 640px; max-width: 80vw; }
  .big-title { font-size: 44px; font-weight: bold; color: #ffd21f; letter-spacing: 2px; }
  .big-sub { font-size: 18px; margin-top: 8px; background: rgba(0,0,0,0.55); padding: 8px 12px;
    border-radius: 4px; display: inline-block; }
  .damage-flash { position: fixed; inset: 0; pointer-events: none; opacity: 0;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(255,0,0,0.55) 100%);
    transition: opacity 0.25s; }
  .hint { position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%);
    font-size: 12px; opacity: 0.75; font-family: Arial, sans-serif; white-space: nowrap; }
  .mute-btn { position: absolute; top: 96px; right: 16px; pointer-events: auto; cursor: pointer;
    background: rgba(0,0,0,0.55); color: #fff; border: 1px solid rgba(255,255,255,0.5);
    border-radius: 4px; padding: 6px 10px; font-size: 13px; font-family: Arial, sans-serif; }

  .overlay { position: fixed; inset: 0; z-index: 20; display: none; align-items: center;
    justify-content: center; background: linear-gradient(160deg, rgba(20,16,40,0.82), rgba(120,50,20,0.72));
    color: #fff; text-align: center; }
  .overlay-inner { max-width: 640px; padding: 30px; }
  .game-title { font-size: 64px; letter-spacing: 6px; color: #ffd21f;
    text-shadow: 0 3px 0 #7a3b2e, 0 6px 18px rgba(0,0,0,0.6); }
  .game-title.small { font-size: 44px; }
  .game-title.red { color: #ff5a4e; text-shadow: 0 3px 0 #5a0e0e, 0 6px 18px rgba(0,0,0,0.6); }
  .game-title.blue { color: #6aa8ff; text-shadow: 0 3px 0 #0e2a5a, 0 6px 18px rgba(0,0,0,0.6); }
  .game-sub { font-size: 20px; font-style: italic; margin: 8px 0 18px; opacity: 0.95; }
  .game-story { font-size: 16px; line-height: 1.55; margin-bottom: 16px; font-family: Arial, sans-serif; }
  .game-controls { font-size: 14px; line-height: 1.6; background: rgba(0,0,0,0.4); padding: 12px 16px;
    border-radius: 6px; margin-bottom: 22px; font-family: Arial, sans-serif; }
  .big-btn { display: block; width: 100%; margin: 8px 0; padding: 13px; font-size: 18px; cursor: pointer;
    background: #ffd21f; color: #241a05; border: none; border-radius: 6px; font-weight: bold;
    font-family: Georgia, serif; }
  .big-btn:hover { background: #ffe14d; }
  .big-btn.secondary { background: rgba(255,255,255,0.16); color: #fff; border: 1px solid rgba(255,255,255,0.5); }
  .big-btn.secondary:hover { background: rgba(255,255,255,0.28); }
  .game-foot { margin-top: 18px; font-size: 12px; opacity: 0.7; font-family: Arial, sans-serif; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="nogl">Solmar City needs WebGL. Please open this page in a desktop browser with hardware acceleration on.</div>
<script src="vendor/three.min.js"></script>
<script src="src/utils.js"></script>
<script src="src/audio.js"></script>
<script src="src/city.js"></script>
<script src="src/traffic.js"></script>
<script src="src/police.js"></script>
<script src="src/player.js"></script>
<script src="src/missions.js"></script>
<script src="src/hud.js"></script>
<script src="src/shots.js"></script>
<script src="src/main.js"></script>
</body>
</html>
