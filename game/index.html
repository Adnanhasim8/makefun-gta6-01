<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Solmar City — a top-down open-world crime game</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0c0f14; }
      #game { display: block; width: 100vw; height: 100vh; }
      #status {
        position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%);
        font: 13px/1.4 system-ui, sans-serif; color: #d7dee8;
        background: rgba(12, 15, 20, 0.6); padding: 4px 10px; border-radius: 6px;
        pointer-events: none; white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="status">Loading…</div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
